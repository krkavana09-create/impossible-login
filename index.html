<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Impossible Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-card">
    <h2>Secure Access Portal</h2>
    
    <div class="input-group">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="off" placeholder="Enter username">
    </div>
    
    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password">
    </div>
    
    <div id="button-container">
      <button type="button" id="login-btn">Log In</button>
      <button type="button" id="refresh-btn">Reset</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
